  <script src="new-app.js"></script>
  <script>
    const SHEET = 'sales_report';
    const CONTACT_METHODS = ['ˆ§ª³§¨','ª„Šˆ†','¥Š…Š„','²Š§±©','£®±‰'];
    const CLIENT_RESPONSES = ['¥Š¬§¨Š','³„¨Š','…¤¬„','„§ ±¯','¹±¶ ³¹± …·„ˆ¨'];

    const session = App.requireAuth(['sales','sales_manager','gm']);
    if (session) init();

    let period = App.currentPeriod();
    let serverDate = App.todayLocal();

    async function init() {
      serverDate = await App.fetchServerDate();
      App.renderNavbar(document.getElementById('navbar'), session, navLinks());

      const ps = document.getElementById('periodSel');
      ps.innerHTML = App.buildPeriodOptions(!App.canArchive(session.role));
      ps.value = period;
      ps.addEventListener('change', () => { period = ps.value; render(); });

      document.getElementById('btnAdd').addEventListener('click', addRow);
      render();
    }

    function navLinks() {
      const links = [];
      if (App.isManager(session.role)) links.push({ label:'Home', href:'new-home.html' });
      links.push({ label:'Sales Sheet', href:'new-sales-sheet.html' });
      return links;
    }

    function render() {
      const rows = App.getRows(SHEET, period);
      const tbody = document.getElementById('tbody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="16" class="text-muted text-center" style="padding:1.5rem;">„§ ªˆ¬¯ ¨Š§†§ª „‡°‡ §„ª±©</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map((r, i) => rowHtml(r, i + 1)).join('');
    }

    function rowHtml(r, num) {
      const mats = App.getApprovedMaterials().map(m => `<option${r.material===m.name?' selected':''}>${m.name}</option>`).join('');
      return `<tr data-id="${r.id}">
        <td>${num}</td>
        <td><input type="date" value="${r.date||''}" onchange="upd(${r.id},'date',this.value)"></td>
        <td><input type="text" value="${esc(r.client||'')}" onchange="upd(${r.id},'client',this.value)" placeholder="§„¹…Š„"></td>
        <td><input type="text" value="${esc(r.manager||'')}" onchange="upd(${r.id},'manager',this.value)" placeholder="§„…³¦ˆ„"></td>
        <td><input type="text" value="${esc(r.phone||'')}" onchange="upd(${r.id},'phone',this.value)" placeholder="§„ª„Šˆ†"></td>
        <td><input type="text" value="${esc(r.whatsapp||'')}" onchange="upd(${r.id},'whatsapp',this.value)" placeholder="§„ˆ§ª³"></td>
        <td><input type="text" value="${esc(r.store||'')}" onchange="upd(${r.id},'store',this.value)" placeholder="§„…®²†"></td>
        <td><select onchange="upd(${r.id},'material',this.value)"><option value="">-- §®ª± --</option>${mats}</select></td>
        <td><input type="text" value="${esc(r.origin||'')}" onchange="upd(${r.id},'origin',this.value)" placeholder="§„…†´£"></td>
        <td><input type="number" step="0.001" value="${r.qty||''}" onchange="upd(${r.id},'qty',this.value)" placeholder="0"></td>
        <td><input type="number" step="0.01" value="${r.price||''}" onchange="upd(${r.id},'price',this.value)" placeholder="0"></td>
        <td><select onchange="upd(${r.id},'contact',this.value)">${CONTACT_METHODS.map(c=>`<option${r.contact===c?' selected':''}>${c}</option>`).join('')}</select></td>
        <td><select onchange="upd(${r.id},'response',this.value)">${CLIENT_RESPONSES.map(c=>`<option${r.response===c?' selected':''}>${c}</option>`).join('')}</select></td>
        <td><input type="text" value="${esc(r.notes||'')}" onchange="upd(${r.id},'notes',this.value)" placeholder="…„§­¸§ª"></td>
        <td><input type="text" value="${esc(r.important||'')}" onchange="upd(${r.id},'important',this.value)" placeholder="…„§­¸§ª ‡§…©"></td>
        <td><button class="btn btn-danger btn-sm" onclick="del(${r.id})">[icon]button></td>
      </tr>`;
    }

    function addRow() {
      App.addRow(SHEET, period, { date: serverDate });
      render();
    }

    function upd(id, key, val) {
      App.updateRow(SHEET, period, id, { [key]: val });
    }

    function del(id) {
      if (confirm('­° ‡°§ §„µŸ')) { App.deleteRow(SHEET, period, id); render(); }
    }

    function esc(s) { return App.escHtml(s); }
  </script>
</body>
