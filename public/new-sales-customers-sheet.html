<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Customers</title>
  <link rel="stylesheet" href="new-styles.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;">
      <h2 class="page-title">Sales Customers</h2>
      <button class="btn btn-primary" id="btnAdd">Add</button>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th></th>
              <th> </th>
              <th></th>
              <th></th>
              <th> </th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h3>  </h3>
      <div class="form-group">
        <label>  *</label>
        <input type="text" id="cName" class="form-control" placeholder=" " />
      </div>
      <div class="form-group">
        <label> </label>
        <input type="text" id="cPhone" class="form-control" placeholder="01xxxxxxxxx" />
      </div>
      <div id="addErr" class="login-error"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnSubmit">Save</button>
        <button class="btn btn-outline" id="btnCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth(['sales','sales_manager','gm']);
    if (session) init();

    function init() {
      App.renderNavbar(document.getElementById('navbar'), session, [
        { label:'  ', href:'new-sales-report.html' },
        { label:'  ', href:'new-sales-sheet.html' },
        ...(session.role === 'sales_manager' || session.role === 'gm'
          ? [{ label:'  ', href:'new-sales-manager.html' }]
          : [])
      ]);

      document.getElementById('btnAdd').addEventListener('click', () => openModal(true));
      document.getElementById('btnCancel').addEventListener('click', () => openModal(false));
      document.getElementById('btnSubmit').addEventListener('click', submit);

      render();
    }

    function openModal(open) {
      document.getElementById('addErr').classList.remove('show');
      if (open) {
        document.getElementById('cName').value = '';
        document.getElementById('cPhone').value = '';
        document.getElementById('addModal').classList.add('open');
      } else {
        document.getElementById('addModal').classList.remove('open');
      }
    }

    function render() {
      const list = App.getCustomers();
      const tbody = document.getElementById('tbody');

      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center" style="padding:1rem;">   </td></tr>';
        return;
      }

      const canApprove = (session.role === 'sales_manager' || session.role === 'gm');

      tbody.innerHTML = list.map((c, i) => {
        const statusLabel =
          c.status === 'pending' ? ' Pending' :
          c.status === 'active' ? ' Active' :
          c.status === 'disabled' ? ' Disabled' : c.status;

        let actionHtml = '-';
        if (c.status === 'pending' && canApprove) actionHtml = `<button class="btn btn-success btn-sm" onclick="approve(${c.id})"> </button>`;
        else if (c.status === 'active' && canApprove) actionHtml = `<button class="btn btn-danger btn-sm" onclick="disable(${c.id})"> </button>`;
        else if (c.status === 'active') actionHtml = `<span class="text-muted"></span>`;

        return `
          <tr>
            <td>${i + 1}</td>
            <td>${App.escHtml(c.name)}</td>
            <td>${App.escHtml(c.phone || '')}</td>
            <td>${statusLabel}</td>
            <td>${App.escHtml(c.createdBy || '')}</td>
            <td>${actionHtml}</td>
          </tr>
        `;
      }).join('');
    }

    function approve(id) { App.approveCustomer(id, session.username); render(); }
    function disable(id) { App.disableCustomer(id, session.username); render(); }

    function submit() {
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      if (!name) {
        const e = document.getElementById('addErr');
        e.textContent = '  ';
        e.classList.add('show');
        return;
      }
      App.addCustomer({ name, phone, createdBy: session.username });
      openModal(false);
      render();
    }
  </script>
</body>
</html>
