<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة الرئيسية</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <h2 class="page-title">🏠 الصفحة الرئيسية</h2>

    <!-- Period filter (managers/GM can change) -->
    <div id="periodBar" class="period-bar card" style="display:none;">
      <label>📅 الفترة الزمنية:</label>
      <select id="periodSel" class="form-control" style="width:180px;"></select>
    </div>

    <div class="home-grid" id="homeGrid"></div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth(['admin', 'proc_manager', 'gm']);
    if (session) init();

    function init() {
      // Render navbar
      const extraLinks = [];
      App.renderNavbar(document.getElementById('navbar'), session, extraLinks);

      // Period bar
      const pb = document.getElementById('periodBar');
      const ps = document.getElementById('periodSel');
      if (App.canArchive(session.role)) {
        pb.style.display = 'flex';
        ps.innerHTML = App.buildPeriodOptions(false);
      }

      // Build cards
      const cards = getCards(session.role);
      const grid  = document.getElementById('homeGrid');
      grid.innerHTML = cards.map(c => `
        <a href="${c.href}" class="home-card">
          <div class="hc-icon">${c.icon}</div>
          <div class="hc-title">${c.title}</div>
          <div class="hc-desc">${c.desc}</div>
        </a>
      `).join('');
    }

    function getCards(role) {
      const base = [];
      if (role === 'admin') {
        base.push({ icon:'👥', title:'إدارة المستخدمين', desc:'عرض وإدارة المستخدمين', href:'new-admin-users.html' });
      }
      if (['gm','proc_manager','admin'].includes(role)) {
        base.push(
          { icon:'📊', title:'تقرير المبيعات',    desc:'عرض تقارير المبيعات',   href:'new-sales-report.html' },
          { icon:'📋', title:'شيت المبيعات',       desc:'إدخال بيانات المبيعات', href:'new-sales-sheet.html' },
          { icon:'🛒', title:'تقرير المشتريات',  desc:'عرض تقارير المشتريات', href:'new-proc-report.html' },
          { icon:'📄', title:'شيت المشتريات',     desc:'إدخال بيانات المشتريات',href:'new-proc-sheet.html' },
          { icon:'📦', title:'قائمة المواد',       desc:'المواد الموحدة',          href:'new-materials.html' },
          { icon:'✅', title:'اعتماد المواد',      desc:'قائمة انتظار الاعتماد',   href:'new-materials-approvals.html' },
        );
      }
      return base;
    }
  </script>
</body>
</html>
