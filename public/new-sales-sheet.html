<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شيت المبيعات</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div class="d-flex justify-between align-center flex-wrap mb-2">
      <h2 class="page-title">📋 شيت المبيعات</h2>
      <button class="btn btn-primary" id="btnAdd">➕ إضافة صف</button>
    </div>

    <div class="period-bar card">
      <label>📅 الفترة:</label>
      <select id="periodSel" class="form-control" style="width:180px;"></select>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>م</th>
              <th>التاريخ</th>
              <th>الاسم</th>
              <th>المسئول</th>
              <th>التليفون</th>
              <th>واتساب</th>
              <th>المكان</th>
              <th>المادة</th>
              <th>الاسم بالانجليزي</th>
              <th>الاسم التجاري</th>
              <th>المنشأ</th>
              <th>الكمية بالكيلو</th>
              <th>السعر</th>
              <th>طريقة التواصل</th>
              <th>رد العميل</th>
              <th>ملاحظات</th>
              <th>ملاحظات الشركة</th>
              <th>تركيز</th>
              <th>الموظف</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const SHEET = 'sales_sheet';
    const CONTACT_METHODS  = ['واتساب','تليفون','إيميل','زيارة','أخرى'];
    const CLIENT_RESPONSES = ['إيجابي','سلبي','مؤجل','لا رد','عرض سعر مطلوب'];

    const session = App.requireAuth(['sales','admin','proc_manager','gm']);
    if (session) init();

    let period = App.currentPeriod();
    let serverDate = App.todayLocal();

    async function init() {
      serverDate = await App.fetchServerDate();
      App.renderNavbar(document.getElementById('navbar'), session, navLinks());

      const ps = document.getElementById('periodSel');
      ps.innerHTML = App.buildPeriodOptions(!App.canArchive(session.role));
      ps.value = period;
      ps.addEventListener('change', () => { period = ps.value; render(); });

      document.getElementById('btnAdd').addEventListener('click', addRow);
      render();
    }

    function navLinks() {
      const links = [];
      if (App.isManager(session.role)) links.push({ label:'🏠 الرئيسية', href:'new-home.html' });
      links.push({ label:'📊 تقرير المبيعات', href:'new-sales-report.html' });
      links.push({ label:'👥 العملاء', href:'new-customers.html' });
      return links;
    }

    function custSelect(r) {
      const custs = App.getActiveCustomers();
      const opts = custs.map(c => `<option value="${esc(c.name)}"${r.name === c.name ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
      return `<select onchange="upd(${r.id},'name',this.value)">
        <option value="">-- اختر عميل --</option>
        ${opts}
        ${r.name && !custs.find(c => c.name === r.name) ? `<option value="${esc(r.name)}" selected>${esc(r.name)}</option>` : ''}
      </select>`;
    }

    function render() {
      const rows = App.getRows(SHEET, period);
      const tbody = document.getElementById('tbody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="20" class="text-muted text-center" style="padding:1.5rem;">لا توجد بيانات لهذه الفترة</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map((r, i) => rowHtml(r, i + 1)).join('');
    }

    function rowHtml(r, num) {
      const mats = App.getApprovedMaterials();
      const matOpts = mats.map(m => `<option value="${m.name}"${r.material===m.name?' selected':''}>${m.name}</option>`).join('');
      const selMat  = mats.find(m => m.name === r.material);
      const matEn   = selMat ? selMat.nameEn : (r.materialEn || '');
      return `<tr data-id="${r.id}">
        <td>${num}</td>
        <td><input type="date" value="${r.date||''}" onchange="upd(${r.id},'date',this.value)"></td>
        <td>${custSelect(r)}</td>
        <td><input type="text" value="${esc(r.manager||'')}" onchange="upd(${r.id},'manager',this.value)" placeholder="المسئول"></td>
        <td><input type="text" value="${esc(r.phone||'')}" onchange="upd(${r.id},'phone',this.value)" placeholder="التليفون"></td>
        <td><input type="text" value="${esc(r.whatsapp||'')}" onchange="upd(${r.id},'whatsapp',this.value)" placeholder="واتساب"></td>
        <td><input type="text" value="${esc(r.place||'')}" onchange="upd(${r.id},'place',this.value)" placeholder="المكان"></td>
        <td><select onchange="onMatChange(${r.id},this.value)"><option value="">-- اختر --</option>${matOpts}</select></td>
        <td><input type="text" value="${esc(matEn)}" readonly placeholder="تلقائي"></td>
        <td><input type="text" value="${esc(r.tradeName||'')}" onchange="upd(${r.id},'tradeName',this.value)" placeholder="الاسم التجاري"></td>
        <td><input type="text" value="${esc(r.origin||'')}" onchange="upd(${r.id},'origin',this.value)" placeholder="المنشأ"></td>
        <td><input type="number" step="0.001" value="${r.qtyKg||''}" onchange="upd(${r.id},'qtyKg',this.value)" placeholder="0"></td>
        <td><input type="number" step="0.01" value="${r.price||''}" onchange="upd(${r.id},'price',this.value)" placeholder="0"></td>
        <td><select onchange="upd(${r.id},'contact',this.value)">${CONTACT_METHODS.map(c=>`<option${r.contact===c?' selected':''}>${c}</option>`).join('')}</select></td>
        <td><select onchange="upd(${r.id},'response',this.value)">${CLIENT_RESPONSES.map(c=>`<option${r.response===c?' selected':''}>${c}</option>`).join('')}</select></td>
        <td><input type="text" value="${esc(r.notes||'')}" onchange="upd(${r.id},'notes',this.value)" placeholder="ملاحظات"></td>
        <td><input type="text" value="${esc(r.companyNotes||'')}" onchange="upd(${r.id},'companyNotes',this.value)" placeholder="ملاحظات الشركة"></td>
        <td><input type="text" value="${esc(r.concentration||'')}" onchange="upd(${r.id},'concentration',this.value)" placeholder="التركيز"></td>
        <td>${esc(session.name)}</td>
        <td><button class="btn btn-danger btn-sm" onclick="del(${r.id})">🗑</button></td>
      </tr>`;
    }

    function addRow() {
      App.addRow(SHEET, period, { date: serverDate, employee: session.name });
      render();
    }

    function upd(id, key, val) {
      App.updateRow(SHEET, period, id, { [key]: val });
    }

    function onMatChange(id, matName) {
      const mats = App.getApprovedMaterials();
      const m = mats.find(x => x.name === matName);
      App.updateRow(SHEET, period, id, { material: matName, materialEn: m ? m.nameEn : '' });
      render();
    }

    function del(id) {
      if (confirm('حذف هذا الصف؟')) { App.deleteRow(SHEET, period, id); render(); }
    }

    function esc(s) { return App.escHtml(s); }
  </script>
</body>
</html>
