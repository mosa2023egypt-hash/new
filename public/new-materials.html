<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المواد الموحدة</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div class="d-flex justify-between align-center flex-wrap mb-2">
      <h2 class="page-title">📦 قائمة المواد الموحدة</h2>
      <button class="btn btn-primary" id="btnAdd">➕ طلب إضافة مادة</button>
    </div>

    <div id="alertArea"></div>

    <!-- Approved materials -->
    <div class="card">
      <h3 class="mb-2" style="color:var(--primary);">✅ المواد المعتمدة</h3>
      <div class="table-wrapper">
        <table id="approvedTable">
          <thead>
            <tr>
              <th>م</th>
              <th>اسم المادة</th>
              <th>الاسم بالانجليزي</th>
              <th>وحدة التسعير</th>
              <th id="unitChangeCol" style="display:none;">تغيير الوحدة</th>
            </tr>
          </thead>
          <tbody id="approvedBody"></tbody>
        </table>
      </div>
    </div>

    <!-- My pending requests -->
    <div class="card" id="myPendingCard">
      <h3 class="mb-2" style="color:var(--accent);">⏳ طلباتي المعلقة</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>م</th><th>اسم المادة</th><th>الاسم بالانجليزي</th><th>الحالة</th><th>تاريخ الطلب</th></tr>
          </thead>
          <tbody id="pendingBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Material Modal -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h3>➕ طلب إضافة مادة جديدة</h3>
      <div class="form-group">
        <label>اسم المادة (عربي) *</label>
        <input type="text" id="matName" class="form-control" placeholder="أدخل اسم المادة بالعربي">
      </div>
      <div class="form-group">
        <label>الاسم بالانجليزي</label>
        <input type="text" id="matNameEn" class="form-control" placeholder="Material name in English">
      </div>
      <div class="form-group">
        <label>وحدة التسعير</label>
        <select id="matUnit" class="form-control">
          <option value="طن" selected>طن (افتراضي)</option>
          <option value="كيلو">كيلو</option>
        </select>
      </div>
      <div id="addError" class="login-error"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnSubmit">إرسال الطلب</button>
        <button class="btn btn-outline" id="btnCancel">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth();
    if (session) init();

    function init() {
      App.renderNavbar(document.getElementById('navbar'), session, navLinks());

      // Show manager-only column
      if (App.canApprove(session.role)) {
        document.getElementById('unitChangeCol').style.display = '';
      }

      render();

      document.getElementById('btnAdd').addEventListener('click', () => {
        document.getElementById('addModal').classList.add('open');
        document.getElementById('addError').classList.remove('show');
        document.getElementById('matName').value = '';
        document.getElementById('matNameEn').value = '';
        document.getElementById('matUnit').value = 'طن';
      });
      document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('addModal').classList.remove('open');
      });
      document.getElementById('btnSubmit').addEventListener('click', submitMaterial);
    }

    function navLinks() {
      const links = [];
      const home = App.homeUrl(session.role);
      if (home) {
        links.push({ label:'🏠 الرئيسية', href: home });
        if (App.canApprove(session.role)) {
          links.push({ label:'✅ اعتماد المواد', href:'new-materials-approvals.html' });
        }
      }
      return links;
    }

    function render() {
      renderApproved();
      renderMyPending();
    }

    function renderApproved() {
      const mats = App.getMaterials().filter(m => m.status === 'approved');
      const tbody = document.getElementById('approvedBody');
      const canChange = App.canApprove(session.role);
      if (!mats.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding:1rem;">لا توجد مواد معتمدة بعد</td></tr>';
        return;
      }
      tbody.innerHTML = mats.map((m, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.nameEn || '-')}</td>
          <td><span class="badge badge-approved">${m.unit}</span></td>
          ${canChange ? `<td>
            <select class="form-control" style="width:100px;" onchange="changeUnit(${m.id},this.value)">
              <option value="طن"${m.unit==='طن'?' selected':''}>طن</option>
              <option value="كيلو"${m.unit==='كيلو'?' selected':''}>كيلو</option>
            </select>
          </td>` : ''}
        </tr>
      `).join('');
    }

    function renderMyPending() {
      const mine = App.getMaterials().filter(m =>
        m.status === 'pending' && m.requestedBy === session.username
      );
      const tbody = document.getElementById('pendingBody');
      if (!mine.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding:1rem;">لا توجد طلبات معلقة</td></tr>';
        return;
      }
      tbody.innerHTML = mine.map((m, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.nameEn || '-')}</td>
          <td><span class="badge badge-pending">في الانتظار</span></td>
          <td>${m.createdAt}</td>
        </tr>
      `).join('');
    }

    function changeUnit(id, unit) {
      const mats = App.getMaterials();
      const m = mats.find(x => x.id === id);
      if (m) { m.unit = unit; App.saveMaterials(mats); }
      showAlert('تم تغيير وحدة التسعير بنجاح', 'success');
    }

    function submitMaterial() {
      const name   = document.getElementById('matName').value.trim();
      const nameEn = document.getElementById('matNameEn').value.trim();
      const unit   = document.getElementById('matUnit').value;
      const errEl  = document.getElementById('addError');

      if (!name) {
        errEl.textContent = 'يرجى إدخال اسم المادة';
        errEl.classList.add('show');
        return;
      }

      // Check duplicate
      const existing = App.getMaterials().find(m => m.name === name);
      if (existing) {
        errEl.textContent = 'هذه المادة موجودة بالفعل';
        errEl.classList.add('show');
        return;
      }

      App.addMaterialRequest(name, nameEn, unit, session.username);
      document.getElementById('addModal').classList.remove('open');
      showAlert('تم إرسال طلب إضافة المادة بنجاح. في انتظار الاعتماد.', 'success');
      render();
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alertArea');
      el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }

    function esc(s) { return App.escHtml(s); }
  </script>
</body>
</html>
