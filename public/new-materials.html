<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div class="d-flex justify-between align-center flex-wrap mb-2">
      <h2 class="page-title">Materials</h2>
      <button class="btn btn-primary" id="btnAdd">Add</button>
    </div>

    <div id="alertArea"></div>

    <!-- Approved materials -->
    <div class="card">
      <h3 class="mb-2" style="color:var(--primary);">  </h3>
      <div class="table-wrapper">
        <table id="approvedTable">
          <thead>
            <tr>
              <th></th>
              <th> </th>
              <th> </th>
              <th> </th>
              <th id="unitChangeCol" style="display:none;"> </th>
            </tr>
          </thead>
          <tbody id="approvedBody"></tbody>
        </table>
      </div>
    </div>

    <!-- My pending requests -->
    <div class="card" id="myPendingCard">
      <h3 class="mb-2" style="color:var(--accent);">  </h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th></th><th> </th><th> </th><th></th><th> </th></tr>
          </thead>
          <tbody id="pendingBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Material Modal -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h3>    </h3>
      <div class="form-group">
        <label>  () *</label>
        <input type="text" id="matName" class="form-control" placeholder="   ">
      </div>
      <div class="form-group">
        <label> </label>
        <input type="text" id="matNameEn" class="form-control" placeholder="Material name in English">
      </div>
      <div class="form-group">
        <label> </label>
        <select id="matUnit" class="form-control">
          <option value="" selected> ()</option>
          <option value=""></option>
        </select>
      </div>
      <div id="addError" class="login-error"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnSubmit">Save</button>
        <button class="btn btn-outline" id="btnCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth();
    if (session) init();

    function init() {
      App.renderNavbar(document.getElementById('navbar'), session, navLinks());

      // Show manager-only column
      if (App.canApproveMaterials(session.role)) {
        document.getElementById('unitChangeCol').style.display = '';
      }

      render();

      document.getElementById('btnAdd').addEventListener('click', () => {
        document.getElementById('addModal').classList.add('open');
        document.getElementById('addError').classList.remove('show');
        document.getElementById('matName').value = '';
        document.getElementById('matNameEn').value = '';
        document.getElementById('matUnit').value = '';
      });
      document.getElementById('btnCancel').addEventListener('click', () => {
        document.getElementById('addModal').classList.remove('open');
      });
      document.getElementById('btnSubmit').addEventListener('click', submitMaterial);
    }

    function navLinks() {
      const links = [];
      if (App.isManager(session.role)) {
        links.push({ label:'Home', href:'new-home.html' });
        links.push({ label:'  ', href:'new-materials-approvals.html' });
      }
      return links;
    }

    function render() {
      renderApproved();
      renderMyPending();
    }

    function renderApproved() {
      const mats = App.getMaterials().filter(m => m.status === 'approved');
      const tbody = document.getElementById('approvedBody');
      const canChange = App.canApproveMaterials(session.role);
      if (!mats.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding:1rem;">    </td></tr>';
        return;
      }
      tbody.innerHTML = mats.map((m, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.nameEn || '-')}</td>
          <td><span class="badge badge-approved">${m.unit}</span></td>
          ${canChange ? `<td>
            <select class="form-control" style="width:100px;" onchange="changeUnit(${m.id},this.value)">
              <option value=""${m.unit===''?' selected':''}></option>
              <option value=""${m.unit===''?' selected':''}></option>
            </select>
          </td>` : ''}
        </tr>
      `).join('');
    }

    function renderMyPending() {
      const mine = App.getMaterials().filter(m =>
        m.status === 'pending' && m.requestedBy === session.username
      );
      const tbody = document.getElementById('pendingBody');
      if (!mine.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding:1rem;">   </td></tr>';
        return;
      }
      tbody.innerHTML = mine.map((m, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.nameEn || '-')}</td>
          <td><span class="badge badge-pending"> </span></td>
          <td>${m.createdAt}</td>
        </tr>
      `).join('');
    }

    function changeUnit(id, unit) {
      const mats = App.getMaterials();
      const m = mats.find(x => x.id === id);
      if (m) { m.unit = unit; App.saveMaterials(mats); }
      showAlert('    ', 'success');
    }

    function submitMaterial() {
      const name   = document.getElementById('matName').value.trim();
      const nameEn = document.getElementById('matNameEn').value.trim();
      const unit   = document.getElementById('matUnit').value;
      const errEl  = document.getElementById('addError');

      if (!name) {
        errEl.textContent = '   ';
        errEl.classList.add('show');
        return;
      }

      // Check duplicate
      const existing = App.getMaterials().find(m => m.name === name);
      if (existing) {
        errEl.textContent = '   ';
        errEl.classList.add('show');
        return;
      }

      App.addMaterialRequest(name, nameEn, unit, session.username);
      document.getElementById('addModal').classList.remove('open');
      showAlert('     .   .', 'success');
      render();
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alertArea');
      el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }

    function esc(s) { return App.escHtml(s); }
  </script>
</body>
</html>
