<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Manager</title>
  <link rel="stylesheet" href="new-styles.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <h2 class="page-title">Sales Manager</h2>

    <div class="card">
      <h3 class="mb-2" style="color:var(--primary);">  </h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th></th>
              <th> </th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="salesUsersBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3 class="mb-2" style="color:var(--primary);">  </h3>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
        <a class="btn btn-primary" href="new-sales-report.html">  </a>
        <a class="btn btn-primary" href="new-sales-sheet.html">  </a>
        <a class="btn btn-primary" href="new-sales-customers-sheet.html">  </a>
      </div>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth(['sales_manager','gm']);
    if (session) init();

    function init() {
      App.renderNavbar(document.getElementById('navbar'), session, []);
      const users = Object.entries(App.DEMO_USERS)
        .map(([username, u]) => ({ username, ...u }))
        .filter(u => u.role === 'sales');

      const tbody = document.getElementById('salesUsersBody');
      tbody.innerHTML = users.length
        ? users.map((u, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${App.escHtml(u.username)}</td>
            <td>${App.escHtml(u.name)}</td>
            <td>${App.escHtml(App.roleLabel(u.role))}</td>
          </tr>
        `).join('')
        : '<tr><td colspan="4" class="text-muted text-center" style="padding:1rem;">   </td></tr>';
    }
  </script>
</body>
</html>
