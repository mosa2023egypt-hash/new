<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم مدير المبيعات</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <h2 class="page-title">📊 لوحة تحكم مدير المبيعات</h2>

    <div class="home-grid" id="homeGrid"></div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth(['sales_manager', 'admin', 'gm']);
    if (session) init();

    function init() {
      App.renderNavbar(document.getElementById('navbar'), session, []);

      const cards = [
        { icon:'📊', title:'تقرير المبيعات',  desc:'عرض وإدخال تقارير المبيعات',  href:'new-sales-report.html' },
        { icon:'📋', title:'شيت المبيعات',    desc:'إدخال بيانات المبيعات',        href:'new-sales-sheet.html' },
        { icon:'🧑‍🤝‍🧑', title:'قائمة العملاء', desc:'إدارة العملاء والموافقة عليهم', href:'new-sales-customers-sheet.html' },
        { icon:'📦', title:'قائمة المواد',    desc:'المواد الموحدة',                href:'new-materials.html' },
      ];

      document.getElementById('homeGrid').innerHTML = cards.map(c => `
        <a href="${c.href}" class="home-card">
          <div class="hc-icon">${c.icon}</div>
          <div class="hc-title">${c.title}</div>
          <div class="hc-desc">${c.desc}</div>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
