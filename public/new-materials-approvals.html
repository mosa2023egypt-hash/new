<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Approvals</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <h2 class="page-title">Materials Approvals</h2>

    <div id="alertArea"></div>

    <!-- Pending -->
    <div class="card">
      <h3 class="mb-2" style="color:var(--accent);">  </h3>
      <div class="table-wrapper">
        <table id="pendingTable">
          <thead>
            <tr>
              <th></th>
              <th> </th>
              <th> </th>
              <th> </th>
              <th> </th>
              <th></th>
              <th> </th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pendingBody"></tbody>
        </table>
      </div>
    </div>

    <!-- All materials -->
    <div class="card">
      <h3 class="mb-2" style="color:var(--primary);"> </h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th></th><th> </th><th> </th><th></th><th></th><th> </th><th></th></tr>
          </thead>
          <tbody id="allBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    const session = App.requireAuth(['proc_manager','sales_manager','gm']);
    if (session) init();

    function init() {
      App.renderNavbar(document.getElementById('navbar'), session, [
        { label:'', href:'new-home.html' },
        { label:' ', href:'new-materials.html' },
      ]);
      render();
    }

    function render() {
      renderPending();
      renderAll();
    }

    function renderPending() {
      const pending = App.getMaterials().filter(m => m.status === 'pending');
      const tbody   = document.getElementById('pendingBody');
      if (!pending.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-muted text-center" style="padding:1rem;">   </td></tr>';
        return;
      }
      tbody.innerHTML = pending.map((m, i) => `
        <tr data-id="${m.id}">
          <td>${i + 1}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.nameEn || '-')}</td>
          <td>${m.unit}</td>
          <td>${esc(m.requestedBy)}</td>
          <td>${m.createdAt}</td>
          <td>
            <select id="unitSel_${m.id}" class="form-control" style="width:90px;">
              <option value=""${m.unit===''?' selected':''}></option>
              <option value=""${m.unit===''?' selected':''}></option>
            </select>
          </td>
          <td class="d-flex gap-1" style="display:flex;gap:.5rem;">
            <button class="btn btn-success btn-sm" onclick="approve(${m.id})"> </button>
            <button class="btn btn-danger btn-sm"  onclick="reject(${m.id})"> </button>
          </td>
        </tr>
      `).join('');
    }

    function renderAll() {
      const mats  = App.getMaterials();
      const tbody = document.getElementById('allBody');
      if (!mats.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-muted text-center" style="padding:1rem;">  </td></tr>';
        return;
      }
      const statusMap = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' };
      const labelMap  = { pending:'', approved:'', rejected:'' };
      tbody.innerHTML = mats.map((m, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.nameEn || '-')}</td>
          <td>${m.unit}</td>
          <td><span class="badge ${statusMap[m.status]}">${labelMap[m.status]}</span></td>
          <td>${esc(m.requestedBy)}</td>
          <td>${m.createdAt}</td>
        </tr>
      `).join('');
    }

    function approve(id) {
      const unit = document.getElementById('unitSel_' + id)?.value || '';
      App.approveMaterial(id, unit);
      showAlert('   ', 'success');
      render();
    }

    function reject(id) {
      if (confirm('    ')) {
        App.rejectMaterial(id);
        showAlert('  ', 'danger');
        render();
      }
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alertArea');
      el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }

    function esc(s) { return App.escHtml(s); }
  </script>
</body>
</html>
