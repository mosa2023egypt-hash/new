<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="new-styles.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">
        <h1>🏢 النظام الداخلي</h1>
        <p>يرجى تسجيل الدخول للمتابعة</p>
      </div>

      <div id="alreadyLogged" class="card" style="display:none;margin-bottom:1rem;">
        <div style="font-weight:700;margin-bottom:.5rem;">أنت مسجل دخول بالفعل</div>
        <div class="d-flex gap-1" style="display:flex;gap:.5rem;">
          <button class="btn btn-primary" id="btnContinue">متابعة</button>
          <button class="btn btn-outline" id="btnLogout">تسجيل خروج</button>
        </div>
      </div>

      <div id="loginError" class="login-error">
        رقم الموبايل أو كلمة المرور غير صحيحة
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">رقم الموبايل / اسم المستخدم</label>
          <input id="username" type="text" class="form-control" placeholder="أدخل رقم الموبايل" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" class="form-control" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">دخول</button>
      </form>

      <p class="text-muted text-center mt-2" style="font-size:.8rem;">
        الجلسة تنتهي عند إغلاق المتصفح
      </p>
    </div>
  </div>

  <script src="new-app.js"></script>
  <script>
    (function () {
      const s = App.getSession();
      if (!s) return;

      document.getElementById('alreadyLogged').style.display = '';
      document.getElementById('btnContinue').addEventListener('click', () => App.redirectByRole(s.role));
      document.getElementById('btnLogout').addEventListener('click', () => App.logout());
    }());

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const session  = App.login(username, password);
      if (session) App.redirectByRole(session.role);
      else document.getElementById('loginError').classList.add('show');
    });

    document.getElementById('username').addEventListener('input', () => document.getElementById('loginError').classList.remove('show'));
    document.getElementById('password').addEventListener('input', () => document.getElementById('loginError').classList.remove('show'));
  </script>
</body>
</html>
